<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCE 自主感知系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: rgba(20, 30, 50, 0.8);
      --panel2: rgba(30, 45, 70, 0.6);
      --line: rgba(100, 150, 255, 0.2);
      --text: #e8f0ff;
      --muted: #7a8db8;
      --acc: #00d4ff;
      --acc2: #7b2cff;
      --warn: #ffaa00;
      --ok: #00ff88;
      --danger: #ff4466;
      --gold: #ffd700;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* 动态背景 */
    .bg-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: float 20s ease-in-out infinite;
    }
    
    .bg-orb:nth-child(1) {
      width: 600px;
      height: 600px;
      background: linear-gradient(135deg, var(--acc), var(--acc2));
      top: -200px;
      right: -100px;
      animation-delay: 0s;
    }
    
    .bg-orb:nth-child(2) {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, var(--acc2), #ff006e);
      bottom: -100px;
      left: -100px;
      animation-delay: -10s;
    }
    
    .bg-orb:nth-child(3) {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, var(--gold), var(--warn));
      top: 50%;
      left: 50%;
      animation-delay: -5s;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 30px) scale(0.9); }
    }
    
    /* 网格背景 */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
    }
    
    /* 内容容器 */
    .content {
      position: relative;
      z-index: 1;
    }
    
    /* 顶部导航 */
    .header {
      background: var(--panel);
      backdrop-filter: blur(20px);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .logo {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo-oce {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
    }
    
    .logo-aware {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00d4ff, #7b2cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    @keyframes glow {
      from { filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.3)); }
      to { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.6)); }
    }
    
    .header-actions { display: flex; gap: 12px; }
    
    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    
    .btn:hover::before { left: 100%; }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--acc), var(--acc2));
      color: white;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 212, 255, 0.6);
    }
    
    .btn-success {
      background: linear-gradient(135deg, var(--ok), #00cc6a);
      color: white;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
    }
    
    .btn-outline {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    
    .btn-outline:hover {
      border-color: var(--acc);
      color: var(--acc);
      background: rgba(0, 212, 255, 0.1);
    }
    
    /* 状态指示器 */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(0, 255, 136, 0.1);
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 136, 0.3);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    
    /* 标签页 */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 15px 40px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }
    
    .tab {
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 0.3s;
      font-weight: 500;
      font-size: 13px;
      flex: 1 1 auto;
      text-align: center;
      min-width: fit-content;
    }
    
    .tab:hover {
      color: var(--text);
      background: var(--panel2);
    }
    
    .tab.active {
      color: white;
      background: linear-gradient(135deg, var(--acc), var(--acc2));
      border-color: transparent;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
    }
    
    .tab-badge {
      background: linear-gradient(135deg, var(--warn), var(--gold));
      color: var(--bg);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      margin-left: 8px;
      font-weight: 700;
    }
    
    /* 主内容 */
    .main { padding: 30px 40px; }
    .panel { display: none; animation: fadeIn 0.5s ease; }
    .panel.active { display: block; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
      border-color: var(--acc);
      box-shadow: 0 10px 40px rgba(0, 212, 255, 0.2);
    }
    
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--acc), var(--acc2));
    }
    
    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--acc), var(--acc2), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    
    .stat-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    /* 卡片 */
    .card {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid var(--line);
      transition: all 0.3s;
    }
    
    .card:hover { border-color: rgba(0, 212, 255, 0.3); }
    
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }
    
    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .card-icon { font-size: 1.5rem; }
    
    /* 状态标签 */
    .status {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .status-pending {
      background: rgba(255, 170, 0, 0.2);
      color: var(--warn);
      border: 1px solid rgba(255, 170, 0, 0.3);
    }
    
    .status-doing {
      background: rgba(0, 212, 255, 0.2);
      color: var(--acc);
      border: 1px solid rgba(0, 212, 255, 0.3);
    }
    
    .status-done {
      background: rgba(0, 255, 136, 0.2);
      color: var(--ok);
      border: 1px solid rgba(0, 255, 136, 0.3);
    }
    
    .status-enabled {
      background: rgba(0, 255, 136, 0.2);
      color: var(--ok);
      border: 1px solid rgba(0, 255, 136, 0.3);
    }
    
    .status-disabled {
      background: rgba(122, 141, 184, 0.2);
      color: var(--muted);
      border: 1px solid rgba(122, 141, 184, 0.3);
    }
    
    /* Focus列表 */
    .focus-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border-radius: 15px;
      background: var(--panel2);
      margin-bottom: 10px;
      transition: all 0.3s;
      border: 1px solid transparent;
    }
    
    .focus-item:hover {
      background: rgba(0, 212, 255, 0.1);
      border-color: rgba(0, 212, 255, 0.3);
      transform: translateX(5px);
    }
    
    .focus-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 10px currentColor;
    }
    
    .focus-dot.pending { background: var(--warn); color: var(--warn); }
    .focus-dot.doing { background: var(--acc); color: var(--acc); animation: pulse 1.5s infinite; }
    .focus-dot.done { background: var(--ok); color: var(--ok); }
    
    .focus-content { flex: 1; }
    .focus-title { font-weight: 600; margin-bottom: 4px; }
    .focus-meta { font-size: 12px; color: var(--muted); }
    
    .focus-actions { display: flex; gap: 8px; }
    
    /* 触发器 */
    .trigger-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      border-radius: 15px;
      background: var(--panel2);
      margin-bottom: 12px;
      border: 1px solid transparent;
      transition: all 0.3s;
    }
    
    .trigger-item:hover {
      border-color: rgba(0, 212, 255, 0.3);
      background: rgba(0, 212, 255, 0.05);
    }
    
    .trigger-icon {
      font-size: 2.5rem;
      width: 60px;
      text-align: center;
      filter: drop-shadow(0 0 10px currentColor);
    }
    
    .trigger-info { flex: 1; }
    .trigger-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; }
    .trigger-schedule { font-size: 12px; color: var(--muted); font-family: 'Orbitron', monospace; }
    .trigger-agent { font-size: 11px; color: var(--acc); margin-top: 5px; }
    
    .trigger-time {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      min-width: 140px;
    }
    
    /* Reflections */
    .reflection {
      padding: 20px;
      border-radius: 15px;
      background: var(--panel2);
      margin-bottom: 12px;
      border-left: 4px solid var(--acc);
      transition: all 0.3s;
    }
    
    .reflection:hover { background: rgba(0, 212, 255, 0.05); }
    
    .reflection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .reflection-agent { font-weight: 700; color: var(--acc); }
    .reflection-time { font-size: 11px; color: var(--muted); }
    .reflection-content { font-size: 14px; line-height: 1.7; color: var(--text); }
    
    .reflection-expand {
      color: var(--acc);
      font-size: 12px;
      cursor: pointer;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    
    .reflection-tools {
      display: none;
      background: var(--bg);
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      border: 1px solid var(--line);
    }
    
    .reflection-tools.show { display: block; }
    
    /* 审批 */
    .approval-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      border-radius: 15px;
      background: var(--panel2);
      margin-bottom: 12px;
      border-left: 4px solid var(--warn);
    }
    
    .approval-icon { font-size: 2rem; }
    .approval-content { flex: 1; }
    .approval-title { font-weight: 700; margin-bottom: 5px; }
    .approval-desc { font-size: 12px; color: var(--muted); }
    .approval-actions { display: flex; gap: 10px; }
    
    /* 系统监控 */
    .monitor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .monitor-item {
      background: var(--panel2);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid var(--line);
      transition: all 0.3s;
    }
    
    .monitor-item:hover { border-color: var(--acc); }
    
    .monitor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    
    .monitor-title { font-weight: 600; }
    .monitor-value { font-family: 'Orbitron', monospace; font-size: 1.5rem; color: var(--acc); }
    
    .monitor-bar {
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .monitor-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--acc), var(--acc2));
      transition: width 0.5s ease;
    }
    
    /* 模态框 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.show { display: flex; animation: fadeIn 0.3s ease; }
    
    .modal-content {
      background: var(--panel);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    .modal-header {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 25px;
      background: linear-gradient(135deg, var(--acc), var(--acc2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--acc);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }
    
    .form-select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 25px;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .header { padding: 15px 20px; flex-wrap: wrap; gap: 10px; }
      .tabs { padding: 15px 20px; }
      .main { padding: 20px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .trigger-item { flex-wrap: wrap; }
      .trigger-time { width: 100%; text-align: left; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <!-- 背景效果 -->
  <div class="bg-effects">
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
  </div>
  <div class="bg-grid"></div>
  
  <!-- 内容 -->
  <div class="content">
    <!-- 顶部导航 -->
    <div class="header">
      <div class="logo">
        <span class="logo-oce">OCE</span>
        <span class="logo-aware">AWARE</span>
      </div>
      <div class="header-actions">
        <div class="status-indicator">
          <div class="status-dot"></div>
          <span style="font-size: 12px; color: var(--ok);">系统运行中</span>
        </div>
        <button class="btn btn-outline" onclick="refreshAll()">🔄 刷新</button>
        <button class="btn btn-primary" onclick="showAddFocus()">+ Focus</button>
        <button class="btn btn-success" onclick="showAddTrigger()">+ Trigger</button>
      </div>
    </div>
    
    <!-- 标签页 -->
    <div class="tabs">
      <div class="tab active" data-panel="dashboard">📊 总览</div>
      <div class="tab" data-panel="monitor">🖥️ 系统监控</div>
      <div class="tab" data-panel="focus">📋 Focus Items <span class="tab-badge" id="focus-total">0</span></div>
      <div class="tab" data-panel="triggers">⏰ 触发器 <span class="tab-badge" id="trigger-total">0</span></div>
      <div class="tab" data-panel="reflections">💭 Reflections</div>
      <div class="tab" data-panel="approvals">⚠️ 待审批 <span class="tab-badge" id="approval-total">0</span></div>
      <div class="tab" data-panel="logs">📜 执行日志</div>
    </div>
    
    <!-- 主内容 -->
    <div class="main">
      <!-- 总览面板 -->
      <div class="panel active" id="panel-dashboard">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="stat-pending">0</div>
            <div class="stat-label">待处理</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-doing">0</div>
            <div class="stat-label">进行中</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-done">0</div>
            <div class="stat-label">已完成</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-triggers">0</div>
            <div class="stat-label">活跃触发器</div>
          </div>
        </div>
        
        <!-- 最近活动 -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">📈 最近活动</span>
          </div>
          <div id="recent-activity">
            <div style="color: var(--muted); text-align: center; padding: 30px;">暂无活动记录</div>
          </div>
        </div>
      </div>
      
      <!-- 系统监控面板 -->
      <div class="panel" id="panel-monitor">
        <div class="monitor-grid" id="monitor-grid">
          <div style="color: var(--muted); text-align: center; padding: 30px; grid-column: 1/-1;">正在加载系统监控数据...</div>
        </div>
      </div>
      
      <!-- Focus Items面板 -->
      <div class="panel" id="panel-focus">
        <div class="card">
          <div class="card-header">
            <span class="card-title">📋 待处理 <span class="status status-pending" id="pending-count">0</span></span>
          </div>
          <div id="focus-pending"></div>
        </div>
        
        <div class="card">
          <div class="card-header">
            <span class="card-title">🔄 进行中 <span class="status status-doing" id="doing-count">0</span></span>
          </div>
          <div id="focus-doing"></div>
        </div>
        
        <div class="card">
          <div class="card-header">
            <span class="card-title">✅ 已完成 <span class="status status-done" id="done-count">0</span></span>
          </div>
          <div id="focus-done"></div>
        </div>
      </div>
      
      <!-- 触发器面板 -->
      <div class="panel" id="panel-triggers">
        <div class="card">
          <div class="card-header">
            <span class="card-title">⏰ 定时触发器</span>
          </div>
          <div id="trigger-list"></div>
        </div>
      </div>
      
      <!-- Reflections面板 -->
      <div class="panel" id="panel-reflections">
        <div class="card">
          <div class="card-header">
            <span class="card-title">💭 AI 自主推理记录</span>
          </div>
          <div id="reflection-list">
            <div style="color: var(--muted); text-align: center; padding: 30px;">暂无推理记录</div>
          </div>
        </div>
      </div>
      
      <!-- 待审批面板 -->
      <div class="panel" id="panel-approvals">
        <div class="card">
          <div class="card-header">
            <span class="card-title">⚠️ 待审批操作</span>
          </div>
          <div id="approval-list">
            <div style="color: var(--muted); text-align: center; padding: 30px;">暂无待审批项</div>
          </div>
        </div>
      </div>
      
      <!-- 执行日志面板 -->
      <div class="panel" id="panel-logs">
        <div class="card">
          <div class="card-header">
            <span class="card-title">📜 触发器执行日志</span>
          </div>
          <div id="log-list">
            <div style="color: var(--muted); text-align: center; padding: 30px;">暂无日志</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 模态框 -->
  <div class="modal" id="modal-focus">
    <div class="modal-content">
      <div class="modal-header">添加 Focus Item</div>
      <div class="form-group">
        <label class="form-label">标题</label>
        <input class="form-input" id="focus-title" placeholder="例如：每日17时汇报待完成任务">
      </div>
      <div class="form-group">
        <label class="form-label">负责Agent</label>
        <select class="form-select" id="focus-agent">
          <option value="助理">助理</option>
          <option value="运维部">运维部</option>
          <option value="产品部">产品部</option>
          <option value="技术部">技术部</option>
          <option value="经营管理部">经营管理部</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">初始状态</label>
        <select class="form-select" id="focus-status">
          <option value="pending">待处理</option>
          <option value="doing">进行中</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('modal-focus')">取消</button>
        <button class="btn btn-primary" onclick="saveFocus()">保存</button>
      </div>
    </div>
  </div>
  
  <div class="modal" id="modal-trigger">
    <div class="modal-content">
      <div class="modal-header">添加触发器</div>
      <div class="form-group">
        <label class="form-label">名称</label>
        <input class="form-input" id="trigger-name" placeholder="例如：每日17时汇报">
      </div>
      <div class="form-group">
        <label class="form-label">类型</label>
        <select class="form-select" id="trigger-type" onchange="updateScheduleInput()">
          <option value="cron">⏰ Cron 定时</option>
          <option value="interval">🔁 间隔执行</option>
          <option value="once">🎯 一次性</option>
          <option value="poll">🔍 HTTP轮询</option>
          <option value="webhook">📨 Webhook</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">执行计划</label>
        <input class="form-input" id="trigger-schedule" placeholder="0 17 * * *">
        <div style="font-size: 11px; color: var(--muted); margin-top: 8px;">cron: 分 时 日 月 周 | interval: 分钟数</div>
      </div>
      <div class="form-group">
        <label class="form-label">负责Agent</label>
        <select class="form-select" id="trigger-agent">
          <option value="助理">助理</option>
          <option value="运维部">运维部</option>
          <option value="产品部">产品部</option>
          <option value="技术部">技术部</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('modal-trigger')">取消</button>
        <button class="btn btn-primary" onclick="saveTrigger()">保存</button>
      </div>
    </div>
  </div>

  <script>
    // 数据存储
    let awareData = { focus_items: [], triggers: [], reflections: [], approvals: [], logs: [] };
    let systemStatus = null;
    
    // 初始化
    async function init() {
      await loadData();
      await loadSystemStatus();
      renderAll();
      // 定时刷新
      setInterval(() => { loadSystemStatus(); renderMonitor(); }, 10000);
    }
    
    // 加载数据
    async function loadData() {
      try {
        const res = await fetch('/data/aware.json');
        awareData = await res.json();
        if(!awareData.reflections) awareData.reflections = [];
        if(!awareData.approvals) awareData.approvals = [];
        if(!awareData.logs) awareData.logs = [];
      } catch(e) { console.log('loadData error', e); }
    }
    
    // 加载OCE系统状态
    async function loadSystemStatus() {
      try {
        // 尝试读取OCE的静态数据文件
        const res = await fetch('/api/oce-status');
        if(res.ok) {
          systemStatus = await res.json();
        }
      } catch(e) { console.log('loadSystemStatus error', e); }
    }
    
    // 渲染全部
    function renderAll() {
      renderDashboard();
      renderMonitor();
      renderFocus();
      renderTriggers();
      renderReflections();
      renderApprovals();
      renderLogs();
    }
    
    // 渲染总览
    function renderDashboard() {
      const pending = awareData.focus_items.filter(f => f.status === 'pending');
      const doing = awareData.focus_items.filter(f => f.status === 'doing');
      const done = awareData.focus_items.filter(f => f.status === 'done');
      const triggers = awareData.triggers.filter(t => t.enabled);
      
      document.getElementById('stat-pending').textContent = pending.length;
      document.getElementById('stat-doing').textContent = doing.length;
      document.getElementById('stat-done').textContent = done.length;
      document.getElementById('stat-triggers').textContent = triggers.length;
      
      const activities = [...awareData.logs].reverse().slice(0, 5);
      const html = activities.length ? activities.map(l => `
        <div class="focus-item">
          <span style="font-size: 1.5rem">${getTriggerIcon(l.type)}</span>
          <div class="focus-content">
            <div class="focus-title">${esc(l.name)}</div>
            <div class="focus-meta">${l.time || ''}</div>
          </div>
          <span class="status ${l.success ? 'status-done' : 'status-pending'}">${l.success ? '✓ 成功' : '✗ 失败'}</span>
        </div>
      `).join('') : '<div style="color: var(--muted); text-align: center; padding: 30px;">暂无活动记录</div>';
      document.getElementById('recent-activity').innerHTML = html;
    }
    
    // 渲染系统监控
    function renderMonitor() {
      if(!systemStatus) {
        document.getElementById('monitor-grid').innerHTML = '<div style="color: var(--muted); text-align: center; padding: 30px; grid-column: 1/-1;">无法连接到OCE系统</div>';
        return;
      }
      
      const agents = systemStatus.agents || [];
      const tasks = systemStatus.tasks || [];
      const total = agents.length;
      const busy = agents.filter(a => a.status === 'busy').length;
      const idle = agents.filter(a => a.status === 'idle').length;
      const offline = total - busy - idle;
      
      const doing = tasks.filter(t => t.state === 'Doing').length;
      const pending = tasks.filter(t => t.state === 'Pending' || t.state === 'Inbox').length;
      const done = tasks.filter(t => t.state === 'Done').length;
      
      const html = `
        <div class="monitor-item">
          <div class="monitor-header">
            <span class="monitor-title">🤖 AI Agent 状态</span>
          </div>
          <div class="monitor-value">${total}</div>
          <div style="margin: 15px 0; display: flex; gap: 10px; font-size: 12px;">
            <span class="status status-doing">忙碌 ${busy}</span>
            <span class="status status-enabled">空闲 ${idle}</span>
            <span class="status status-disabled">离线 ${offline}</span>
          </div>
          <div class="monitor-bar">
            <div class="monitor-bar-fill" style="width: ${total ? (busy/total*100) : 0}%"></div>
          </div>
        </div>
        
        <div class="monitor-item">
          <div class="monitor-header">
            <span class="monitor-title">📜 任务状态</span>
          </div>
          <div class="monitor-value">${tasks.length}</div>
          <div style="margin: 15px 0; display: flex; gap: 10px; font-size: 12px;">
            <span class="status status-doing">执行 ${doing}</span>
            <span class="status status-pending">待处理 ${pending}</span>
            <span class="status status-done">完成 ${done}</span>
          </div>
          <div class="monitor-bar">
            <div class="monitor-bar-fill" style="width: ${tasks.length ? (done/tasks.length*100) : 0}%"></div>
          </div>
        </div>
        
        <div class="monitor-item">
          <div class="monitor-header">
            <span class="monitor-title">🏢 部门分布</span>
          </div>
          <div style="margin-top: 10px; max-height: 200px; overflow-y: auto;">
            ${getDeptStats(agents).map(d => `
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line);">
                <span style="font-size: 13px;">${d.name}</span>
                <span style="font-family: 'Orbitron', monospace; color: var(--acc);">${d.count}</span>
              </div>
            `).join('')}
          </div>
        </div>
        
        <div class="monitor-item">
          <div class="monitor-header">
            <span class="monitor-title">⚡ 系统健康度</span>
          </div>
          <div class="monitor-value" style="color: var(--ok);">${Math.round((total - offline) / total * 100)}%</div>
          <div style="margin-top: 15px; font-size: 12px; color: var(--muted);">
            在线率: ${total - offline}/${total}<br>
            响应时间: ${systemStatus.responseTime || '< 100ms'}
          </div>
        </div>
      `;
      document.getElementById('monitor-grid').innerHTML = html;
    }
    
    function getDeptStats(agents) {
      const depts = {};
      agents.forEach(a => {
        const d = a.org || '未知';
        depts[d] = (depts[d] || 0) + 1;
      });
      return Object.entries(depts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count).slice(0, 10);
    }
    
    // 渲染Focus
    function renderFocus() {
      const pending = awareData.focus_items.filter(f => f.status === 'pending');
      const doing = awareData.focus_items.filter(f => f.status === 'doing');
      const done = awareData.focus_items.filter(f => f.status === 'done');
      
      document.getElementById('focus-total').textContent = awareData.focus_items.length;
      document.getElementById('pending-count').textContent = pending.length;
      document.getElementById('doing-count').textContent = doing.length;
      document.getElementById('done-count').textContent = done.length;
      
      document.getElementById('focus-pending').innerHTML = pending.length ? pending.map(f => renderFocusItem(f)).join('') : '<div style="color: var(--muted); padding: 20px; text-align: center;">暂无待处理事项</div>';
      document.getElementById('focus-doing').innerHTML = doing.length ? doing.map(f => renderFocusItem(f)).join('') : '<div style="color: var(--muted); padding: 20px; text-align: center;">暂无进行中事项</div>';
      document.getElementById('focus-done').innerHTML = done.length ? done.map(f => renderFocusItem(f)).join('') : '<div style="color: var(--muted); padding: 20px; text-align: center;">暂无已完成事项</div>';
    }
    
    function renderFocusItem(f) {
      return `
        <div class="focus-item">
          <div class="focus-dot ${f.status}"></div>
          <div class="focus-content">
            <div class="focus-title">${esc(f.title)}</div>
            <div class="focus-meta">👤 ${f.agent} · 📅 ${f.created_at || ''}</div>
          </div>
          <div class="focus-actions">
            ${f.status === 'pending' ? `<button class="btn btn-primary" style="padding: 6px 12px; font-size: 11px;" onclick="updateFocusStatus('${f.id}', 'doing')">开始</button>` : ''}
            ${f.status === 'doing' ? `<button class="btn btn-success" style="padding: 6px 12px; font-size: 11px;" onclick="updateFocusStatus('${f.id}', 'done')">完成</button>` : ''}
            <button class="btn btn-outline" style="padding: 6px 12px; font-size: 11px;" onclick="deleteFocus('${f.id}')">删除</button>
          </div>
        </div>
      `;
    }
    
    // 渲染触发器
    function renderTriggers() {
      document.getElementById('trigger-total').textContent = awareData.triggers.length;
      
      const html = awareData.triggers.length ? awareData.triggers.map(t => `
        <div class="trigger-item">
          <div class="trigger-icon">${getTriggerIcon(t.type)}</div>
          <div class="trigger-info">
            <div class="trigger-name">${esc(t.name)}</div>
            <div class="trigger-schedule">${t.schedule || t.interval_minutes + '分钟'}</div>
            <div class="trigger-agent">👤 ${t.agent}</div>
          </div>
          <div class="trigger-time">
            <div>⏭ 下次: ${t.next_run || '-'}</div>
            <div style="font-size: 10px; color: var(--muted);">⏮ 上次: ${t.last_run || '-'}</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <span class="status ${t.enabled ? 'status-enabled' : 'status-disabled'}">${t.enabled ? '● 运行中' : '○ 已停止'}</span>
            <button class="btn btn-outline" style="padding: 6px 12px; font-size: 11px;" onclick="toggleTrigger('${t.id}')">${t.enabled ? '停止' : '启动'}</button>
          </div>
        </div>
      `).join('') : '<div style="color: var(--muted); text-align: center; padding: 30px;">暂无触发器，点击顶部按钮添加</div>';
      
      document.getElementById('trigger-list').innerHTML = html;
    }
    
    function getTriggerIcon(type) {
      const icons = { cron: '⏰', interval: '🔁', once: '🎯', poll: '🔍', webhook: '📨', on_message: '💬' };
      return icons[type] || '⏰';
    }
    
    // 渲染Reflections
    function renderReflections() {
      const html = awareData.reflections.length ? awareData.reflections.map(r => `
        <div class="reflection">
          <div class="reflection-header">
            <span class="reflection-agent">🤖 ${esc(r.agent)}</span>
            <span class="reflection-time">${r.time || ''}</span>
          </div>
          <div class="reflection-content">${esc(r.content)}</div>
          ${r.tools ? `<div class="reflection-expand" onclick="toggleTools(this)">🔧 查看工具调用</div><div class="reflection-tools">${esc(r.tools)}</div>` : ''}
        </div>
      `).join('') : '<div style="color: var(--muted); text-align: center; padding: 30px;">暂无推理记录</div>';
      document.getElementById('reflection-list').innerHTML = html;
    }
    
    // 渲染审批
    function renderApprovals() {
      document.getElementById('approval-total').textContent = awareData.approvals.length;
      
      const html = awareData.approvals.length ? awareData.approvals.map(a => `
        <div class="approval-item">
          <div class="approval-icon">⚠️</div>
          <div class="approval-content">
            <div class="approval-title">${esc(a.title)}</div>
            <div class="approval-desc">${esc(a.desc)} · ${a.agent}</div>
          </div>
          <div class="approval-actions">
            <button class="btn btn-success" style="padding: 8px 16px; font-size: 12px;" onclick="approveAction('${a.id}')">批准</button>
            <button class="btn btn-outline" style="padding: 8px 16px; font-size: 12px;" onclick="rejectAction('${a.id}')">拒绝</button>
          </div>
        </div>
      `).join('') : '<div style="color: var(--muted); text-align: center; padding: 30px;">暂无待审批项</div>';
      document.getElementById('approval-list').innerHTML = html;
    }
    
    // 渲染日志
    function renderLogs() {
      const html = awareData.logs.length ? awareData.logs.slice(-30).reverse().map(l => `
        <div class="focus-item">
          <span style="font-size: 1.3rem">${getTriggerIcon(l.type)}</span>
          <div class="focus-content">
            <div class="focus-title">${esc(l.name)}</div>
            <div class="focus-meta">${l.message || ''}</div>
          </div>
          <div style="text-align: right;">
            <span class="status ${l.success ? 'status-done' : 'status-pending'}">${l.success ? '✓' : '✗'}</span>
            <div style="font-size: 10px; color: var(--muted); margin-top: 5px;">${l.time || ''}</div>
          </div>
        </div>
      `).join('') : '<div style="color: var(--muted); text-align: center; padding: 30px;">暂无日志</div>';
      document.getElementById('log-list').innerHTML = html;
    }
    
    // 标签页切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
      });
    });
    
    // 模态框
    function showAddFocus() { document.getElementById('modal-focus').classList.add('show'); }
    function showAddTrigger() { document.getElementById('modal-trigger').classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
    
    function updateScheduleInput() {
      const type = document.getElementById('trigger-type').value;
      const input = document.getElementById('trigger-schedule');
      if(type === 'cron') input.placeholder = '0 17 * * *';
      else if(type === 'interval') input.placeholder = '5';
      else if(type === 'once') input.placeholder = '2026-03-26 17:00';
      else if(type === 'poll') input.placeholder = 'https://api.example.com/health';
    }
    
    // 保存Focus
    function saveFocus() {
      const title = document.getElementById('focus-title').value;
      const agent = document.getElementById('focus-agent').value;
      const status = document.getElementById('focus-status').value;
      
      if(!title) return alert('请输入标题');
      
      awareData.focus_items.push({
        id: 'focus_' + Date.now(),
        title, agent, status,
        created_at: new Date().toISOString().replace('T', ' ').substring(0, 19)
      });
      
      saveData();
      closeModal('modal-focus');
      renderAll();
      alert('✅ Focus已添加');
    }
    
    // 保存触发器
    function saveTrigger() {
      const name = document.getElementById('trigger-name').value;
      const type = document.getElementById('trigger-type').value;
      const schedule = document.getElementById('trigger-schedule').value;
      const agent = document.getElementById('trigger-agent').value;
      
      if(!name || !schedule) return alert('请填写完整');
      
      awareData.triggers.push({
        id: 'trigger_' + Date.now(),
        name, type, agent,
        schedule,
        interval_minutes: type === 'interval' ? parseInt(schedule) : null,
        enabled: true,
        last_run: null,
        next_run: calculateNextRun(type, schedule)
      });
      
      saveData();
      closeModal('modal-trigger');
      renderAll();
      alert('✅ 触发器已添加');
    }
    
    function calculateNextRun(type, schedule) {
      const now = new Date();
      if(type === 'cron') return now.toISOString().substring(0, 10) + ' 预计次日';
      if(type === 'interval') return now.toISOString().substring(0, 16);
      return schedule;
    }
    
    // 更新Focus状态
    function updateFocusStatus(id, status) {
      const f = awareData.focus_items.find(x => x.id === id);
      if(f) {
        f.status = status;
        if(status === 'done') f.completed_at = new Date().toISOString().replace('T', ' ').substring(0, 19);
        saveData();
        renderAll();
      }
    }
    
    // 删除Focus
    function deleteFocus(id) {
      if(confirm('确认删除？')) {
        awareData.focus_items = awareData.focus_items.filter(f => f.id !== id);
        saveData();
        renderAll();
      }
    }
    
    // 切换触发器
    function toggleTrigger(id) {
      const t = awareData.triggers.find(x => x.id === id);
      if(t) {
        t.enabled = !t.enabled;
        saveData();
        renderAll();
      }
    }
    
    // 审批操作
    function approveAction(id) {
      awareData.approvals = awareData.approvals.filter(a => a.id !== id);
      saveData();
      renderAll();
      alert('✅ 已批准');
    }
    
    function rejectAction(id) {
      awareData.approvals = awareData.approvals.filter(a => a.id !== id);
      saveData();
      renderAll();
    }
    
    // 展开工具
    function toggleTools(el) {
      el.nextElementSibling.classList.toggle('show');
      el.textContent = el.textContent.includes('查看') ? '🔧 收起工具调用' : '🔧 查看工具调用';
    }
    
    // 保存数据
    async function saveData() {
      try {
        await fetch('/data/aware.json', {
          method: 'PUT',
          body: JSON.stringify(awareData, null, 2)
        });
      } catch(e) { console.log('saveData error', e); }
    }
    
    // 转义
    function esc(str) {
      if(!str) return '';
      return String(str).replace(/[<>"'&]/g, c => ({"<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","&":"&amp;"}[c]));
    }
    
    // 刷新
    function refreshAll() {
      loadData().then(() => loadSystemStatus()).then(renderAll);
    }
    
    init();
  </script>
</body>
</html>
