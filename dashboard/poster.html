<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<title>海报</title>
<style>
* { margin: 0; padding: 0; }
body { width: 1080px; height: 1920px; background: linear-gradient(180deg, #0f172a 0%, #1e3a5f 100%); font-family: 'Noto Sans SC', sans-serif; }
.container { padding: 60px; text-align: center; color: white; }
.logo { font-size: 160px; font-weight: 800; background: linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 80px 0 20px; }
.subtitle { font-size: 52px; font-weight: 600; margin-bottom: 15px; }
.english { font-size: 30px; color: #94a3b8; margin-bottom: 60px; }
.features { margin: 60px 0; }
.feature { font-size: 36px; margin: 30px 0; color: white; }
.price-box { background: rgba(37, 99, 235, 0.2); border: 3px solid #2563eb; border-radius: 25px; padding: 50px; margin: 60px 80px; }
.price-label { font-size: 30px; color: #94a3b8; }
.price { font-size: 70px; font-weight: 700; color: #f59e0b; margin: 15px 0; }
.qr-box { margin: 50px 0; }
.qr-code { width: 220px; height: 220px; border-radius: 15px; }
.qr-text { font-size: 26px; color: #94a3b8; margin-top: 12px; }
.contact { margin: 40px 0; }
.contact-email { font-size: 36px; color: white; margin-top: 8px; }
.footer { margin-top: 50px; color: #64748b; font-size: 28px; }
</style>
</head>
<body>
<div class="container">
    <div class="logo">OCE</div>
    <div class="subtitle">企业级AI协作平台</div>
    <div class="english">OpenClaw Enterprise</div>
    
    <div class="features">
        <div class="feature">🤖 AI员工自主协作</div>
        <div class="feature">💰 降本增效神器</div>
        <div class="feature">🚀 零风险试错机会</div>
        <div class="feature">⚡ 7×24小时运营</div>
    </div>
    
    <div class="price-box">
        <div class="price-label">专业版仅需</div>
        <div class="price">¥29,999/年</div>
    </div>
    
    <div class="qr-box">
        <img src="qrcode.png" class="qr-code" alt="扫码体验">
        <div class="qr-text">扫码免费体验DEMO</div>
    </div>
    
    <div class="contact">
        <div class="contact-email">slysfly@163.com</div>
    </div>
    
    <div class="footer">通维咨询 出品</div>
</div>
</body>
</html>
